<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Scotland Mission</title>
<style>
:root{
  --navy:#16324f; --loch:#1f5f8b; --sea:#bfe0ee; --heather:#7a4b94; --heather-d:#5c3572;
  --green:#2f6b4f; --green-l:#dcefe2; --sand:#f6efdf; --paper:#fffdf7; --ink:#1d2733;
  --gold:#e0a526; --red:#b3372f; --red-l:#fbe3e0; --line:#d8cfba; --ok:#1f7a4d;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;line-height:1.2;margin:0 0 .4em;color:var(--navy)}
h1{font-size:1.7rem} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.4em 0}
.de{color:#4d5a68;font-size:.9em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;color:#fff;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 6px,transparent 6px 28px,rgba(224,165,38,.35) 28px 31px,transparent 31px 56px),
   repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 6px,transparent 6px 28px,rgba(224,165,38,.25) 28px 31px,transparent 31px 56px),
   var(--navy);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .brand{font:700 1.15rem "Trebuchet MS",system-ui,sans-serif;margin-right:auto;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pill{background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px;font-size:.9rem;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;min-height:40px;padding:4px 14px;font-size:.9rem}
.tbtn[aria-pressed="true"]{background:var(--gold);color:#1d2733;border-color:var(--gold)}
main{max-width:1060px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 2px 0 rgba(22,50,79,.08);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;border:2px solid var(--navy);
  background:var(--navy);color:#fff;font-weight:700;font-size:1.05rem}
.btn.alt{background:#fff;color:var(--navy)}
.btn.go{background:var(--green);border-color:var(--green)}
.btn.hot{background:var(--heather);border-color:var(--heather)}
.btn.small{min-height:44px;padding:6px 14px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.banner{background:#fff3cd;border:2px solid #d39e00;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.95rem}
.field{width:100%;font:inherit;font-size:1.25rem;padding:12px 14px;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--ink);min-height:54px}
label{font-weight:700;display:block;margin-bottom:6px}

/* map */
.maplay{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.maplay{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.mapbox{background:var(--sea);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:78vh}
.mk{cursor:pointer}
.stations{display:grid;gap:10px}
.st{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;min-height:76px;
  background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:10px 14px}
.st:hover{border-color:var(--loch)}
.st .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 1.3rem "Trebuchet MS",sans-serif;color:#fff;background:var(--loch)}
.st.s2 .num{background:var(--green)} .st.s3 .num{background:var(--heather)} .st.fin .num{background:var(--red)} .st.tr .num{background:var(--gold);color:#1d2733}
.st b{display:block;font-size:1.1rem;color:var(--navy)}
.st small{color:#4d5a68}
.st .state{font-size:.85rem;font-weight:700;color:var(--green);white-space:nowrap}
.st.fin{border-color:var(--red);background:#fff8f6}
.pass{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stamp{width:76px;height:76px;border-radius:50%;border:3px dashed #b9ad92;display:grid;place-items:center;color:#b9ad92;font-size:.62rem;text-align:center;line-height:1.1}
.stamp.got{border:3px double var(--heather);color:var(--heather);transform:rotate(-8deg);background:#f5ecfa;font-weight:700}
.stamp.got.g1{border-color:var(--loch);color:var(--loch);background:#e6f2f9}
.stamp.got.g2{border-color:var(--green);color:var(--green);background:var(--green-l);transform:rotate(6deg)}
details.plan{font-size:.95rem} details.plan summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}

/* tasks */
.bar{height:12px;background:#e6dcc6;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--loch),var(--green));border-radius:99px;transition:width .3s}
.taskhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.q{font-size:1.3rem;font-weight:700;color:var(--navy);margin:.3em 0 .6em}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--navy);text-align:center;padding:0 6px;color:var(--ok)}
mark{background:#ffe9a8;border-radius:6px;padding:0 4px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid var(--loch);background:#fff;font-size:1.08rem;text-align:left;width:100%}
.opt.sel{background:#e3f0f8;border-width:3px;border-color:var(--navy);font-weight:700}
.opt.right{background:var(--green-l);border-color:var(--ok);font-weight:700}
.opt.wrongo{background:var(--red-l);border-color:var(--red);opacity:.6;text-decoration:line-through}
.opt:disabled{cursor:default}
.matchgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.matchgrid .col{display:grid;gap:10px;align-content:start}
.fb{border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:600}
.fb.ok{background:var(--green-l);border:2px solid var(--ok);color:#12492f}
.fb.no{background:var(--red-l);border:2px solid var(--red);color:#6d1f1a}
.fb.info{background:#eef3f8;border:2px solid var(--loch);color:var(--navy)}
.fb small{display:block;font-weight:400}
.hintpat{font:700 1.3rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.plane{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.calm *, .calm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* check */
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dot{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.95rem}
.dot.a{background:var(--green-l);border-color:var(--ok)}
.dot.cur{outline:3px solid var(--navy)}
.ovl{width:100%;border-collapse:collapse;font-size:.98rem}
.ovl th,.ovl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;word-break:break-word}
.ovl tr.open td{background:#fff3cd}
.ovl td:first-child{white-space:nowrap}
@media (max-height:520px){.top{position:static}}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:700}
.tag.ok{background:var(--green-l);color:#12492f}.tag.no{background:var(--red-l);color:#6d1f1a}.tag.op{background:#fff3cd;color:#6b5200}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin:10px 0}
.score div{background:#eef3f8;border-radius:12px;padding:10px 6px}
.score b{display:block;font-size:1.5rem;color:var(--navy)}
.rules li{margin:.35em 0}
.overlay{position:fixed;inset:0;background:rgba(15,25,40,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--paper);border-radius:var(--r);padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.printonly{display:none}
@media print{
  .top,.noprint,.overlay{display:none!important}
  body{background:#fff;font-size:12pt}
  .card{border:none;box-shadow:none;padding:0}
  .printonly{display:block}
}
@media (max-width:420px){body{font-size:17px}.btn{padding:10px 16px}.st{grid-template-columns:48px 1fr;}.st .state{grid-column:2}}
</style>
</head>
<body>
<div id="top" class="top"></div>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:20px">Diese App braucht JavaScript. Öffne sie über den Link deiner Lehrkraft im Browser (Safari).</p></noscript>
<script>
/* Scotland Mission – gemeinsame Test- und Bewertungslogik (in beiden Dateien identisch eingebettet) */
var SM = (function () {
  'use strict';
  var APP_VERSION = '1.0.0';
  var TEST_VERSION = 'SM-U2-CHECK-1';
  var FORMAT = 'scotland-mission-result';
  var FORMAT_VERSION = 1;

  /* Schritt 1: Leerzeichen und Apostrophe vereinheitlichen (Gross-/Kleinschreibung bleibt erhalten) */
  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[‘’‚‛ʼ´`′]/g, "'")
      .replace(/[\s ]+/g, ' ')
      .trim();
  }
  /* Schritt 2: Vergleichsschluessel – ein Punkt am Ende (iPad-Doppelleerzeichen) entfaellt, Kleinschreibung */
  function stripDot(s) { return norm(s).replace(/\s*\.+$/, '').trim(); }
  function key(s) { return stripDot(s).toLowerCase(); }

  function noun(w) {
    var art = /^[aeiou]/i.test(w) ? 'an ' : 'a ';
    return [w, 'the ' + w, art + w];
  }
  function verb(w) { return [w, 'to ' + w]; }

  var CHECK = [
    { id: 'v01', type: 'tr', area: 'vocab', de: 'die Insel', expected: 'island', accept: noun('island') },
    { id: 'v02', type: 'tr', area: 'vocab', de: 'bewohnt', expected: 'inhabited', accept: ['inhabited'] },
    { id: 'v03', type: 'tr', area: 'vocab', de: 'die Ebbe', expected: 'low tide', accept: ['low tide', 'the low tide'] },
    { id: 'v04', type: 'tr', area: 'vocab', de: 'die Helden (Plural – mehrere)', expected: 'heroes', accept: ['heroes', 'the heroes'] },
    { id: 'v05', type: 'tr', area: 'vocab', de: 'besiegen', expected: 'to defeat', accept: verb('defeat') },
    { id: 'v06', type: 'tr', area: 'vocab', de: 'unabhängig', expected: 'independent', accept: ['independent'] },
    { id: 'v07', type: 'tr', area: 'vocab', de: 'schottisch', expected: 'Scottish', accept: ['scottish'], cap: 'Scottish' },
    { id: 'v08', type: 'tr', area: 'vocab', de: 'der Dudelsack', expected: 'bagpipes', accept: ['bagpipes', 'the bagpipes'] },
    { id: 'v09', type: 'tr', area: 'vocab', de: 'stattfinden', expected: 'to take place', accept: verb('take place') },
    { id: 'v10', type: 'tr', area: 'vocab', de: 'wegen', expected: 'because of', accept: ['because of'] },
    { id: 'v11', type: 'tr', area: 'vocab', de: 'der Erfinder, die Erfinderin', expected: 'inventor', accept: noun('inventor') },
    { id: 'v12', type: 'tr', area: 'vocab', de: 'die Mitternacht', expected: 'midnight', accept: ['midnight'] },
    { id: 'g01', type: 'gap', area: 'vocab', sentence: 'At low tide the planes can ___ from the beach.', de: 'abheben, starten', expected: 'take off', accept: ['take off'] },
    { id: 'g02', type: 'gap', area: 'vocab', sentence: 'The school concert is the biggest ___ of the year.', de: 'die Veranstaltung', expected: 'event', accept: ['event'] },
    { id: 'g03', type: 'gap', area: 'vocab', sentence: 'Many people have jobs in the oil ___.', de: 'die Industrie', expected: 'industry', accept: ['industry'] },
    { id: 'f01', type: 'mc', area: 'facts', q: 'What is the capital of Scotland?', correct: 'a',
      options: [{ id: 'a', t: 'Edinburgh' }, { id: 'b', t: 'Glasgow' }, { id: 'c', t: 'London' }, { id: 'd', t: 'Cardiff' }] },
    { id: 'f02', type: 'mc', area: 'facts', q: 'Scotland is part of …', correct: 'a',
      options: [{ id: 'a', t: 'the United Kingdom (UK)' }, { id: 'b', t: 'Ireland' }, { id: 'c', t: 'the USA' }, { id: 'd', t: 'France' }] },
    { id: 'f03', type: 'mc', area: 'facts', q: 'What is Ben Nevis?', correct: 'a',
      options: [{ id: 'a', t: 'the highest mountain in the UK' }, { id: 'b', t: 'a Scottish hero' }, { id: 'c', t: 'a loch with a monster' }, { id: 'd', t: 'the capital of Scotland' }] },
    { id: 'f04', type: 'mc', area: 'facts', q: 'Where do planes land on the island of Barra?', correct: 'a',
      options: [{ id: 'a', t: 'on the beach' }, { id: 'b', t: 'on a loch' }, { id: 'c', t: 'on a mountain' }, { id: 'd', t: 'on a bridge' }] },
    { id: 'f05', type: 'mc', area: 'facts', q: 'What are the Highland Games?', correct: 'a',
      options: [{ id: 'a', t: 'a sports event' }, { id: 'b', t: 'a New Year’s Eve tradition' }, { id: 'c', t: 'a boat trip on Loch Ness' }, { id: 'd', t: 'a museum in Edinburgh' }] }
  ];
  var BY_ID = {};
  CHECK.forEach(function (it) { BY_ID[it.id] = it; });
  var MAX = { vocab: 15, facts: 5, total: 20 };

  function optionText(item, optId) {
    for (var i = 0; i < item.options.length; i++) if (item.options[i].id === optId) return item.options[i].t;
    return '';
  }
  function expectedText(item) {
    if (item.type === 'mc') return optionText(item, item.correct);
    if (item.type === 'tr' && item.accept.length > 1) {
      return item.expected + ' (auch: ' + item.accept.filter(function (a) { return a !== item.expected.toLowerCase(); }).join(', ') + ')';
    }
    return item.expected;
  }
  function promptText(item) {
    if (item.type === 'mc') return item.q;
    if (item.type === 'gap') return item.sentence + ' [' + item.de + ']';
    return item.de;
  }

  /* Bewertet genau eine Aufgabe aus der unveraenderten Originaleingabe. */
  function scoreItem(item, raw) {
    var r = { status: 'open', points: 0, note: '' };
    if (item.type === 'mc') {
      if (raw == null || raw === '') return r;
      if (raw === item.correct) { r.status = 'correct'; r.points = 1; } else r.status = 'wrong';
      return r;
    }
    var k = key(raw);
    if (k === '') return r;
    if (item.accept.indexOf(k) !== -1) {
      r.status = 'correct'; r.points = 1;
      if (item.cap && norm(raw).indexOf(item.cap) === -1) {
        r.note = 'Schreibhinweis: „' + item.cap + '“ wird großgeschrieben (kein Punktabzug).';
      }
    } else r.status = 'wrong';
    return r;
  }

  /* Bewertet einen ganzen Versuch. answers: Liste {id, raw}. Rechnet immer aus den Originaleingaben. */
  function scoreAttempt(answers) {
    var map = {};
    (answers || []).forEach(function (a) { if (a && typeof a.id === 'string' && !(a.id in map)) map[a.id] = a.raw; });
    var out = { items: [], vocab: 0, facts: 0, total: 0 };
    CHECK.forEach(function (item) {
      var raw = Object.prototype.hasOwnProperty.call(map, item.id) ? map[item.id] : null;
      var s = scoreItem(item, raw);
      out.items.push({ id: item.id, area: item.area, type: item.type, raw: raw, status: s.status, auto: s.points, note: s.note });
      out[item.area] += s.points;
    });
    out.total = out.vocab + out.facts;
    return out;
  }

  function isIso(s) { return typeof s === 'string' && s.length <= 40 && !isNaN(Date.parse(s)); }

  /* Prueft eine importierte Ergebnisdatei und liefert eine bereinigte Kopie nur mit bekannten Feldern. */
  function validateResult(o) {
    function bad(m) { return { ok: false, error: m }; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) return bad('Die Datei enthält kein Ergebnisobjekt.');
    if (o.format !== FORMAT) return bad('Das ist keine Scotland-Mission-Ergebnisdatei (Kennzeichen „format“ fehlt oder ist falsch).');
    if (o.formatVersion !== FORMAT_VERSION) return bad('Unbekannte Dateiversion (' + String(o.formatVersion).slice(0, 20) + ').');
    if (o.testVersion !== TEST_VERSION) return bad('Andere Testversion (' + String(o.testVersion).slice(0, 30) + ' statt ' + TEST_VERSION + ').');
    if (typeof o.studentCode !== 'string' || !/^[A-Za-z0-9][A-Za-z0-9_-]{0,15}$/.test(o.studentCode)) return bad('Schülercode fehlt oder hat ein ungültiges Format.');
    if (typeof o.attemptId !== 'string' || !/^[A-Za-z0-9_-]{4,64}$/.test(o.attemptId)) return bad('Versuchskennung fehlt oder ist ungültig.');
    if (!isIso(o.startedAt) || !isIso(o.submittedAt)) return bad('Start- oder Abgabezeit fehlt oder ist kein gültiges Datum.');
    if (!Array.isArray(o.answers) || o.answers.length > 60) return bad('Die Antwortliste fehlt oder ist ungültig.');
    var answers = [], seen = {};
    for (var i = 0; i < o.answers.length; i++) {
      var a = o.answers[i];
      if (!a || typeof a !== 'object' || typeof a.id !== 'string') return bad('Antwort ' + (i + 1) + ' ist beschädigt.');
      if (!BY_ID[a.id]) return bad('Unbekannte Aufgabenkennung in Antwort ' + (i + 1) + '.');
      if (seen[a.id]) return bad('Aufgabe ' + a.id + ' kommt mehrfach vor.');
      if (a.raw !== null && typeof a.raw !== 'string') return bad('Antwort zu ' + a.id + ' ist kein Text.');
      if (a.raw !== null && a.raw.length > 200) return bad('Antwort zu ' + a.id + ' ist unplausibel lang.');
      seen[a.id] = true;
      answers.push({ id: a.id, raw: a.raw });
    }
    var order = [];
    if (Array.isArray(o.order)) o.order.slice(0, 60).forEach(function (x) { if (typeof x === 'string' && BY_ID[x]) order.push(x); });
    var clean = {
      format: FORMAT, formatVersion: FORMAT_VERSION,
      appVersion: typeof o.appVersion === 'string' ? o.appVersion.slice(0, 20) : '',
      testVersion: TEST_VERSION,
      studentCode: o.studentCode.toUpperCase(),
      attemptId: o.attemptId,
      attemptNoOnDevice: (typeof o.attemptNoOnDevice === 'number' && isFinite(o.attemptNoOnDevice)) ? Math.round(o.attemptNoOnDevice) : null,
      startedAt: new Date(o.startedAt).toISOString(),
      submittedAt: new Date(o.submittedAt).toISOString(),
      order: order, answers: answers
    };
    return { ok: true, clean: clean };
  }
  function fingerprint(clean) {
    var a = clean.answers.slice().sort(function (x, y) { return x.id < y.id ? -1 : 1; });
    return JSON.stringify([clean.studentCode, clean.attemptId, clean.startedAt, clean.submittedAt, clean.order, a]);
  }

  return {
    APP_VERSION: APP_VERSION, TEST_VERSION: TEST_VERSION, FORMAT: FORMAT, FORMAT_VERSION: FORMAT_VERSION,
    CHECK: CHECK, BY_ID: BY_ID, MAX: MAX,
    norm: norm, key: key, stripDot: stripDot, noun: noun, verb: verb,
    scoreItem: scoreItem, scoreAttempt: scoreAttempt, validateResult: validateResult, fingerprint: fingerprint,
    optionText: optionText, expectedText: expectedText, promptText: promptText
  };
})();
if (typeof module !== 'undefined') module.exports = SM;

</script>
<script>
(function () {
'use strict';

/* ---------- Wortschatz (33 Eintraege; hero/heroes als Singular- und Pluralaufgabe) ---------- */
var W = [
 {id:'island',en:'island',de:'die Insel',t:'n',s:'Barra is a small ___ in the sea.',d:['valley','loch','event']},
 {id:'few',en:'few',de:'wenige',t:'x',s:'Only very ___ people live here – just ten!',d:['Scottish','independent','inhabited'],ctx:1},
 {id:'inhabited',en:'inhabited',de:'bewohnt',t:'x',s:'People live on this island, so it is ___.',d:['independent','few','Scottish'],ctx:1},
 {id:'travel',en:'to travel',base:'travel',de:'reisen, fahren',t:'v',s:'Next summer we want to ___ to Scotland by train.',d:['invent','defeat','take place']},
 {id:'takeoff',en:'to take off',base:'take off',de:'starten, abheben, durchstarten, ausziehen',tp:'abheben, starten (Flugzeug) – 2 Wörter',t:'v',s:'Fasten your seat belts! The plane is ready to ___.',d:['take place','invent','defeat']},

function h(tag, attrs, kids) {
  var e = document.createElement(tag), k;
  if (attrs) for (k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k) || attrs[k] == null || attrs[k] === false) continue;
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  add(e, kids);
  return e;
}
function add(e, kids) {
  if (kids == null) return;
  if (!Array.isArray(kids)) kids = [kids];
  kids.forEach(function (c) { if (c == null || c === false) return; if (Array.isArray(c)) add(e, c); else e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); });
}

}

var KEY = 'scotlandMission.v1', storageOK = false, saveFailed = false;
function testStorage() { try { localStorage.setItem(KEY + '.t', '1'); var ok = localStorage.getItem(KEY + '.t') === '1'; localStorage.removeItem(KEY + '.t'); return ok; } catch (e) { return false; } }

var state = { v: 1, code: '', sound: false, calm: false, practice: freshPractice(), current: null, attempts: [] };
function load() {
  storageOK = testStorage();
  if (!storageOK) return;
  try {
    var s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && s.v === 1) {
      state = s;
      if (!state.practice || !state.practice.st) state.practice = freshPractice();
      if (!Array.isArray(state.attempts)) state.attempts = [];
    }
  } catch (e) { saveFailed = true; }
}

  if (!storageOK) return;

  catch (e) { if (!saveFailed) { saveFailed = true; renderTop(); } }
}

var actx = null;
function beep(kind) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var seq = kind === 'ok' ? [660, 880] : kind === 'stamp' ? [523, 659, 784, 1046] : [220];
    seq.forEach(function (f, i) {
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.11;
      o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}

var starting = false;

}

      input.addEventListener('input', function () { cur.answers[id] = input.value; save(); dots(); });

    h('table', { class: 'ovl' }, [h('thead', {}, h('tr', {}, [h('th', { text: '#' }), h('th', { text: 'Task' }), h('th', { text: 'Your answer' }), h('th', {})])), tb]),
    h('div', { class: 'row', style: 'margin-top:14px;justify-content:space-between' }, [

/* ---------- Ergebnis, Export, Druck ---------- */
function exportObj(a) {

    studentCode: a.studentCode, attemptId: a.attemptId, attemptNoOnDevice: a.no, startedAt: a.startedAt, submittedAt: a.submittedAt,
    order: a.order, optionOrders: a.optionOrders,

}
function fileName(a) { return 'ScotlandMission_' + a.studentCode + '_' + a.attemptId + '.json'; }

  add($app, [
